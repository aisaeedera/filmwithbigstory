<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wedding Quotation UX — Internal Design Evidence</title>
<style>
:root{--bg:#08080a;--alt:#0b0b0c;--elev:#111114;--ink:#fafaf7;--muted:#aaa9a3;--gold:#c9a227;--line:#29292d;--error:#d96662;--success:#62b58b;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}.shell{max-width:1240px;margin:auto;padding:0 clamp(20px,4vw,48px)}header{border-bottom:1px solid var(--line);padding:20px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-family:Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.02em}.brand span,.eyebrow,.tag{color:var(--gold)}.eyebrow,.tag{font:12px/1.2 monospace;letter-spacing:.15em;text-transform:uppercase}.mode{padding:5px 9px;border:1px solid var(--gold);border-radius:999px;font-size:12px;color:var(--gold)}.section{padding:68px 0;border-bottom:1px solid var(--line)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end}h1,h2,h3{font-family:Georgia,serif;line-height:1.08;margin:0}h1{font-size:clamp(42px,6vw,80px);max-width:12ch}h2{font-size:clamp(30px,4vw,50px)}h3{font-size:22px}.lead{max-width:56ch;font-size:19px;color:#e2e1dc}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.button{min-height:48px;padding:13px 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--gold);font-weight:700}.primary{background:var(--gold);color:var(--bg)}.secondary{color:var(--ink)}.note{font-size:14px;color:var(--muted);margin-top:14px}.card{background:var(--elev);border:1px solid var(--line);border-radius:var(--radius);padding:26px}.card.gold{border-color:#8a7019}.grid{display:grid;gap:18px}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}.package{display:flex;flex-direction:column;min-height:360px}.package ul,.summary ul{padding:0;margin:20px 0;list-style:none}.package li,.summary li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:#dddcd6}.package li:before{content:'— ';color:var(--gold)}.package .button{margin-top:auto}.recommend{display:inline-block;background:var(--gold);color:var(--bg);padding:4px 8px;border-radius:999px;font:11px monospace;text-transform:uppercase}.progress{display:flex;gap:7px;margin:20px 0 40px}.dot{height:8px;flex:1;border-radius:10px;background:var(--line)}.dot.active{background:var(--gold)}.step{display:grid;grid-template-columns:1.1fr .9fr;gap:28px}.choice{padding:18px;border:1px solid var(--line);border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}.choice.selected{border-color:var(--gold);background:#1a1710}.pill{font-size:12px;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted);white-space:nowrap}.pill.warn{border-color:var(--error);color:var(--error)}.disabled{opacity:.48;pointer-events:none}.summary{position:sticky;top:20px}.warning{border-left:3px solid var(--error);background:#201415;padding:14px 16px;color:#f4d3d1;font-size:14px;margin-top:18px}.success{border-left:3px solid var(--success);background:#102018;padding:14px 16px;color:#d2eedf;font-size:14px}.cta-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mini{background:var(--alt);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.mobilebar{display:none}.ar{direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif}.ar h1,.ar h2,.ar h3{font-family:Tahoma,Arial,sans-serif;line-height:1.35}.ar .eyebrow,.ar .tag{letter-spacing:0}.ar .package li:before{content:'— '}.legal{font-size:13px;color:var(--muted);max-width:90ch}.quote-ref{font:14px monospace;color:var(--gold)}
@media(max-width:760px){.hero,.step{grid-template-columns:1fr;gap:28px}.three,.two,.cta-board{grid-template-columns:1fr}.section{padding:42px 0}h1{font-size:44px}.summary{position:static}.bar nav{display:none}.package{min-height:auto}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const view=new URLSearchParams(location.search).get('view')||'cta';
const en={
 cta:`<header><div class="shell bar"><div class="brand">BIG <span>STORY</span></div><nav class="tag">Weddings / Quotation</nav><div class="mode">INTERNAL DESIGN</div></div></header><main><section class="section"><div class="shell hero"><div><p class="eyebrow">Wedding coverage</p><h1>Build a wedding quotation around your day.</h1><p class="lead">Start with a male-wedding package, then tailor released coverage choices before Big Story reviews availability and scope.</p><div class="buttons"><a class="button primary">Build your quotation <b>→</b></a><a class="button secondary">Explore wedding coverage</a></div><p class="note">No payment, booking or availability confirmation is made in this flow.</p></div><aside class="card gold"><p class="eyebrow">New quotation route</p><h3>Male weddings are active</h3><p>Compare Silver, Gold and Platinum coverage before you share your mobile number.</p><p class="tag">Arabic + English · Mobile-first</p></aside></div></section><section class="section"><div class="shell"><p class="eyebrow">Entry-point contract</p><h2>One clear quotation CTA on each relevant wedding page.</h2><div class="cta-board" style="margin-top:30px"><article class="mini"><p class="tag">/services/weddings</p><h3>Primary hero CTA</h3><p><b>EN:</b> Build your wedding quotation<br><b>AR:</b> أنشئ عرض زفافك</p><p class="note">Gold button, internal route: <code>/wedding-quotation</code>. Existing cinematic-package link remains the secondary action.</p></article><article class="mini"><p class="tag">/services/groom-wedding-services</p><h3>Primary hero CTA</h3><p><b>EN:</b> Build a male-wedding quotation<br><b>AR:</b> أنشئ عرض زفاف رجالي</p><p class="note">Replaces the generic WhatsApp primary at this entry point; WhatsApp remains an adjacent secondary support action.</p></article></div></div></section></main>`,
 flow:`<header><div class="shell bar"><div class="brand">BIG <span>STORY</span></div><nav class="tag">Wedding quotation / 02 Package</nav><div class="mode">EN</div></div></header><main><section class="section"><div class="shell"><p class="eyebrow">Wedding quotation</p><h1>Choose your starting package.</h1><p class="lead">All packages start with eight coverage hours and the same operational baseline. Details stay visible; detailed pricing unlocks only after mobile verification.</p><div class="progress" aria-label="Step 2 of 5"><i class="dot active"></i><i class="dot active"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="grid three"><article class="card package"><p class="tag">Silver</p><h3>Essential record</h3><ul><li>1 videographer + 1 photographer</li><li>3–5 minute highlight</li><li>50 edited photographs</li><li>21-day delivery target · 1 revision round</li></ul><a class="button secondary">Select Silver</a></article><article class="card gold package"><span class="recommend">Recommended starting point</span><p class="tag" style="margin-top:14px">Gold</p><h3>Complete wedding day</h3><ul><li>2 videographers + 1 photographer</li><li>5–8 minute highlight + key-event film + social cut</li><li>100 edited photographs</li><li>14-day delivery target · 2 revision rounds</li></ul><a class="button primary">Select Gold</a></article><article class="card package"><p class="tag">Platinum</p><h3>Expanded coverage</h3><ul><li>2 videographers + 2 photographers</li><li>8–12 minute highlight + extended film + 3 social cuts</li><li>150 edited photographs</li><li>7-day target subject to verified release</li></ul><a class="button secondary">Select Platinum</a></article></div><p class="legal" style="margin-top:24px">Included in every package: professional photography, crane/jib with supplier operator, YouTube livestream, basic QR sharing, two display-only QR screens, cloud delivery, original camera files, and required crew communications. No payment or booking is available at this stage.</p></div></section><section class="section"><div class="shell step"><div><p class="eyebrow">03 / Customize</p><h2>Choose released extras. Ask for the rest.</h2><div class="choice selected"><span><b>Guest programme screens</b><br><small>Choose TV size and quantity</small></span><span class="pill">Released when export supplies price</span></div><div class="choice"><span><b>Extra coverage hours</b><br><small>Package-specific calculated rate</small></span><span class="pill">Controlled</span></div><div class="choice"><span><b>Modular LED wall</b><br><small>Venue/supplier dependent</small></span><span class="pill warn">Price Confirmation Required</span></div><div class="choice disabled"><span><b>Instagram Live</b><br><small>Not released</small></span><span class="pill">Coming Soon</span></div></div><aside class="card summary"><p class="tag">Your configuration</p><h3>Gold package</h3><ul><li>8 included coverage hours</li><li>Two QR displays included</li><li>Guest programme screens: not selected</li></ul><div class="warning"><b>Pricing status:</b> Verify your mobile number to view the controlled quotation. Price Confirmation Required items will not be included in a confirmed total.</div><div class="buttons"><a class="button primary">Continue to verification →</a></div></aside></div></section></main><div class="mobilebar"><a class="button primary">Continue to verification →</a></div>`,
 otp:`<header><div class="shell bar"><div class="brand">BIG <span>STORY</span></div><nav class="tag">Wedding quotation / 04 Verify</nav><div class="mode">EN</div></div></header><main><section class="section"><div class="shell step"><div><p class="eyebrow">04 / Price gate</p><h1>Verify your mobile number to view detailed pricing.</h1><p class="lead">You can browse and customize without an account. We ask for your name and a verified mobile number only before showing controlled line-item prices and totals.</p><div class="card" style="margin-top:28px"><label>Your name<br><input style="width:100%;margin-top:8px;padding:14px;background:#08080a;border:1px solid #29292d;border-radius:10px;color:#fafaf7" placeholder="Your full name" /></label><label style="display:block;margin-top:18px">Mobile number<br><input style="width:100%;margin-top:8px;padding:14px;background:#08080a;border:1px solid #29292d;border-radius:10px;color:#fafaf7" placeholder="+971 5X XXX XXXX" /></label><p class="legal">We use your verified number to link this configuration to your quotation request. OTP verification does not confirm availability, price approval, payment or booking.</p><div class="buttons"><a class="button primary">Send one-time code →</a></div></div></div><aside class="card summary"><p class="tag">What happens next</p><h3>Review before any payment.</h3><ul><li>Big Story checks date, venue and technical feasibility</li><li>Supplier, crew and editor capacity are validated</li><li>Any Price Confirmation Required item stays non-binding</li><li>Only an approved quotation can later offer payment/booking</li></ul><div class="success"><b>Privacy-first:</b> no OTP values or client-identifying data in analytics.</div></aside></div></section></main>`,
 review:`<header><div class="shell bar"><div class="brand">BIG <span>STORY</span></div><nav class="tag">Wedding quotation / 05 Review</nav><div class="mode">EN</div></div></header><main><section class="section"><div class="shell step"><div><p class="eyebrow">05 / Review request</p><h1>Your configuration is ready for Big Story review.</h1><p class="lead">This is not a booking or payment confirmation. We will verify the date, venue, crew, technical requirements and any supplier-dependent selections before issuing an approved quotation.</p><div class="card" style="margin-top:28px"><p class="quote-ref">Configuration reference: WQ-XXXX</p><h3>Gold package</h3><ul class="summary"><li>8 included coverage hours</li><li>Professional photography, crane/jib operator, YouTube livestream, QR sharing and two QR displays included</li><li>Original photo and video delivery by cloud download</li><li>60-day client cloud access from delivery notification</li><li>YouTube archive remains until an authorized removal request</li></ul><div class="warning"><b>Price Confirmation Required:</b> Modular LED wall. This selection is not included in a confirmed total and cannot proceed to payment/booking until Big Story approves it.</div><div class="buttons"><a class="button primary">Submit for Big Story review</a><a class="button secondary">Edit configuration</a></div></div></div><aside class="card summary"><p class="tag">Locked commercial terms</p><h3>Shown before submission.</h3><ul><li>100% upfront payment is required only after Big Story approves the quotation to lock a date.</li><li>Cancellation more than 7 days before the event: 50% charge / 50% refund.</li><li>Cancellation within 7 days: 100% charge / no refund.</li><li>Reduce scope before offering a discount.</li><li>Additional revision rounds or new scope require a priced change order.</li></ul></aside></div></section></main>`
};
const ar={flow:`<div class="ar"><header><div class="shell bar"><div class="brand">بيك <span>ستوري</span></div><nav class="tag">عرض الزفاف / 02 الباقة</nav><div class="mode">AR</div></div></header><main><section class="section"><div class="shell"><p class="eyebrow">عرض الزفاف</p><h1>اختر باقتك كبداية.</h1><p class="lead">تبدأ كل الباقات بثماني ساعات تغطية وبنفس الأساس التشغيلي. التفاصيل ظاهرة؛ الأسعار التفصيلية لا تظهر إلا بعد التحقق من رقم الهاتف.</p><div class="progress"><i class="dot active"></i><i class="dot active"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="grid three"><article class="card package"><p class="tag">سيلفر</p><h3>توثيق أساسي</h3><ul><li>مصور فيديو واحد + مصور فوتوغرافي واحد</li><li>فيلم مختارات 3–5 دقائق</li><li>50 صورة معدلة</li><li>هدف تسليم 21 يوماً · جولة تعديل واحدة</li></ul><a class="button secondary">اختر سيلفر</a></article><article class="card gold package"><span class="recommend">النقطة الموصى بها</span><p class="tag" style="margin-top:14px">جولد</p><h3>يوم زفاف متكامل</h3><ul><li>مصورا فيديو + مصور فوتوغرافي</li><li>مختارات + فيلم فعاليات + مقطع اجتماعي</li><li>100 صورة معدلة</li><li>هدف تسليم 14 يوماً · جولتا تعديل</li></ul><a class="button primary">اختر جولد</a></article><article class="card package"><p class="tag">بلاتينيوم</p><h3>تغطية موسعة</h3><ul><li>مصورا فيديو + مصورا فوتوغرافي</li><li>مختارات + فيلم موسع + 3 مقاطع اجتماعية</li><li>150 صورة معدلة</li><li>هدف 7 أيام رهن الإطلاق المتحقق</li></ul><a class="button secondary">اختر بلاتينيوم</a></article></div><p class="legal" style="margin-top:24px">تشمل كل باقة: التصوير الفوتوغرافي، الرافعة/الجيب مع مشغّل المورد، بث يوتيوب، مشاركة QR، شاشتي QR للعرض فقط، التسليم السحابي، ملفات الكاميرا الأصلية واتصالات الطاقم اللازمة. لا يوجد دفع أو حجز في هذه المرحلة.</p></div></section><section class="section"><div class="shell step"><div><p class="eyebrow">03 / خصص</p><h2>اختر الإضافات التي تم إطلاقها. واطلب الباقي.</h2><div class="choice selected"><span><b>شاشات برنامج الضيوف</b><br><small>اختر مقاس التلفاز والكمية</small></span><span class="pill">عند توفير السعر المعتمد</span></div><div class="choice"><span><b>ساعات تغطية إضافية</b><br><small>سعر محسوب حسب الباقة</small></span><span class="pill">محكوم</span></div><div class="choice"><span><b>جدار LED معياري</b><br><small>يعتمد على الموقع والمورد</small></span><span class="pill warn">يتطلب تأكيد السعر</span></div><div class="choice disabled"><span><b>إنستغرام لايف</b><br><small>غير مطلق</small></span><span class="pill">قريباً</span></div></div><aside class="card summary"><p class="tag">تكوينك</p><h3>باقة جولد</h3><ul><li>8 ساعات تغطية مشمولة</li><li>شاشتا QR مشمولتان</li><li>شاشات البرنامج: لم تُختر</li></ul><div class="warning"><b>حالة السعر:</b> تحقق من رقم هاتفك لعرض العرض المحكوم. العناصر التي تتطلب تأكيد السعر لا تدخل في إجمالي مؤكد.</div><div class="buttons"><a class="button primary">تابع إلى التحقق ←</a></div></aside></div></section></main><div class="mobilebar"><a class="button primary">تابع إلى التحقق ←</a></div></div>`};
document.getElementById('app').innerHTML=view==='ar'?ar.flow:en[view]||en.cta;
</script>
</body>
</html>
